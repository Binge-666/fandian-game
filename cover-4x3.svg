<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="饭点大作战">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#fbe7da"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.4" fill="#5d3a1a" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#dots)"/>

  <!-- 顶部红条 -->
  <rect x="0" y="0" width="1600" height="14" fill="#d7261e"/>

  <!-- 左列文案 -->
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="360" height="56" rx="28" fill="#ffc72c"/>
    <text x="180" y="38" text-anchor="middle" fill="#5d3a1a" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="26" font-weight="900">60 秒 · 配餐挑战</text>

    <text x="0" y="248" fill="#ffc72c" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="168" font-weight="900" opacity="0.9" transform="translate(8 8)">饭点</text>
    <text x="0" y="248" fill="#2a1c12" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="168" font-weight="900">饭点</text>
    <text x="0" y="404" fill="#ffc72c" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="168" font-weight="900" transform="translate(8 8)">大作战</text>
    <text x="0" y="404" fill="#d7261e" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="168" font-weight="900">大作战</text>

    <text x="4" y="480" fill="#5d3a1a" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="34" font-weight="700">顾客只给三个数：热量 · 预算 · 口味</text>
    <text x="4" y="530" fill="#8a6a4a" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="28">60 秒内配出一份能过关的餐，配得越准连击越高</text>

    <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="26" font-weight="900" fill="#5d3a1a">
      <rect x="4" y="566" width="140" height="52" rx="26" fill="#ffedb8"/>
      <text x="74" y="601" text-anchor="middle">1 主食</text>
      <rect x="160" y="566" width="140" height="52" rx="26" fill="#ffedb8"/>
      <text x="230" y="601" text-anchor="middle">1 饮料</text>
      <rect x="316" y="566" width="160" height="52" rx="26" fill="#ffedb8"/>
      <text x="396" y="601" text-anchor="middle">最多 4 件</text>
    </g>

    <rect x="4" y="660" width="472" height="76" rx="38" fill="#d7261e"/>
    <text x="240" y="709" text-anchor="middle" fill="#fffdf8" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="32" font-weight="900">3 颗心 · 连击 ×3 · 好友战书 PK</text>
  </g>

